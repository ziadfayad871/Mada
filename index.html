    <!-- Script to ensure trailing slash on GitHub Pages for clean asset resolution -->
    <script>
      (function() {
        if (window.location.pathname === '/Mada') {
          window.history.replaceState(null, '', '/Mada/' + window.location.search + window.location.hash);
        }
      })();
    </script>
